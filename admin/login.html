<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in | Urban Growth Conclave 2.0</title>
    <link rel="icon" href="../brand/mp-icon.png" type="image/png" />
    <meta name="description" content="Administration sign-in for the Madhya Pradesh Urban Growth Conclave." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://urbangis.mp.gov.in; base-uri 'self'; form-action 'none'; object-src 'none'" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin-body admin-gate">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="admin-shell">
      <header class="admin-header-wrap">
        <div class="saffron-bar"></div>
        <div class="admin-header">
          <a class="brand" href="../index.html">
            <img src="../brand/mp-gov.png" alt="Government of Madhya Pradesh" width="447" height="447" />
            <img src="../brand/gis.png" alt="Invest Madhya Pradesh" width="447" height="447" />
            <img class="wordmark" src="../brand/primary-logo-v2.png" alt="Madhya Pradesh Urban Growth Conclave 2.0" width="659" height="197" />
          </a>
        </div>
      </header>
      <main id="main" class="login-main">
        <form id="admin-login" class="login-card" method="post" action="#" novalidate>
          <p class="kicker">Government of Madhya Pradesh</p>
          <h1>Urban Conclave Admin</h1>
          <p class="lede">Sign in with the user ID issued for registration administration.</p>
          <div class="field-block">
            <label for="user-id">User ID</label>
            <input id="user-id" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="128" required />
          </div>
          <div class="field-block">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required />
          </div>
          <div id="login-toast" class="form-alert" role="alert" hidden>
            <p id="login-toast-text"></p>
            <button id="login-toast-close" type="button">Dismiss</button>
          </div>
          <button id="login-submit" class="btn btn-accent btn-block" type="submit">Sign in</button>
        </form>
      </main>
      <footer class="admin-footer">
        <p>© 2026 Department of Urban Development And Housing, Government of Madhya Pradesh.</p>
      </footer>
    </div>
    <noscript>
      <p class="noscript">JavaScript is required to use the administration dashboard.</p>
    </noscript>
    <script src="../js/admin/config.js"></script>
    <script src="../js/admin/session.js"></script>
    <script src="../js/admin/api.js"></script>
    <script src="../js/admin/login.js"></script>
  </body>
</html>
